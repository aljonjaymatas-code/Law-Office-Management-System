<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Office Management System - Staff Portal Login</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for In-Browser JSX Transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Linked Stylesheet -->
    <link rel="stylesheet" href="staff-styles.css">
</head>
<body class="bg-[#020617] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const ACCESS_REQUESTS_KEY = 'law-office-document-access-requests';
        const DOCUMENT_REVIEW_KEY = 'law-office-document-review';
        const APPOINTMENTS_KEY = 'law-office-appointment-workflow';
        const NOTIFICATIONS_KEY = 'law-office-notifications';

        function readNotifications() {
          const savedNotifications = window.localStorage.getItem(NOTIFICATIONS_KEY);
          if (!savedNotifications) return [];
          try {
            const notifications = JSON.parse(savedNotifications);
            return Array.isArray(notifications) ? notifications : [];
          } catch (error) {
            console.error('Unable to read portal notifications from browser storage.', error);
            return [];
          }
        }

        function readAppointmentRecords() {
          const savedAppointments = window.localStorage.getItem(APPOINTMENTS_KEY);
          if (!savedAppointments) {
            return [
              { appointment_id: 'seed-1', title: 'Case Consultation', client: 'Jane Doe', appointment_date: '2026-04-10 10:00 AM', type: 'Consultation', status: 'Confirmed — Master Calendar Updated' },
              { appointment_id: 'seed-2', title: 'Court Hearing Prep', client: 'Acme Corporation', appointment_date: '2026-04-12 02:00 PM', type: 'Hearing', status: 'Confirmed — Master Calendar Updated' }
            ];
          }
          try {
            const appointments = JSON.parse(savedAppointments);
            return Array.isArray(appointments) ? appointments : [];
          } catch (error) {
            console.error('Unable to read appointment workflow records from browser storage.', error);
            return [];
          }
        }

        function readDocumentSubmissions() {
          const savedDocuments = window.localStorage.getItem(DOCUMENT_REVIEW_KEY);
          if (!savedDocuments) return [];
          try {
            const documents = JSON.parse(savedDocuments);
            return Array.isArray(documents) ? documents : [];
          } catch (error) {
            console.error('Unable to read document submissions from browser storage.', error);
            return [];
          }
        }

        function readDocumentAccessRequests() {
          const savedRequests = window.localStorage.getItem(ACCESS_REQUESTS_KEY);
          if (!savedRequests) return [];
          try {
            const requests = JSON.parse(savedRequests);
            return Array.isArray(requests) ? requests : [];
          } catch (error) {
            console.error('Unable to read document access requests from browser storage.', error);
            return [];
          }
        }

        function StaffPortalApp() {
          // Authentication state: 'login' or 'dashboard'
          const [authStatus, setAuthStatus] = useState('login');
          const [activeTab, setActiveTab] = useState('clients');
          const [menuOpen, setMenuOpen] = useState(false);
          const [intakeModalOpen, setIntakeModalOpen] = useState(false);
          const [appointmentModalOpen, setAppointmentModalOpen] = useState(false);
          const [appointmentError, setAppointmentError] = useState('');
          const [alternativeSelections, setAlternativeSelections] = useState({});
          const [dailySummary, setDailySummary] = useState('');
          const [dailySummaryMessage, setDailySummaryMessage] = useState('');
          const [uploadModalOpen, setUploadModalOpen] = useState(false);
          const [selectedUploadFile, setSelectedUploadFile] = useState(null);
          const [uploadDocumentTitle, setUploadDocumentTitle] = useState('');
          const [uploadError, setUploadError] = useState('');
          const [documentAccessRequests, setDocumentAccessRequests] = useState(readDocumentAccessRequests);
          const [selectedReviewNote, setSelectedReviewNote] = useState(null);
          const [searchQuery, setSearchQuery] = useState('');
          const searchInputRef = useRef(null);
          const [notifications, setNotifications] = useState(readNotifications);
          const [notificationsOpen, setNotificationsOpen] = useState(false);

          // Login form inputs
          const [emailInput, setEmailInput] = useState('sarah.staff@lawoffice.com');
          const [passwordInput, setPasswordInput] = useState('password123');
          const today = new Date();
          const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

          // Staff Profile mock data matching role specifications[span_0](start_span)[span_0](end_span)
          const staffProfile = {
            fullname: 'Sarah Jenkins',
            email: 'sarah.staff@lawoffice.com',
            role: 'Staff'
          };

          // Entities data limited strictly to staff tasks: clients, appointments, documents[span_1](start_span)[span_1](end_span)
          const [clients, setClients] = useState([
            { client_id: 1, fullname: 'Jane Doe', email: 'jane@example.com', phone: '+1 (555) 019-2834', address: '123 Legal Way' },
            { client_id: 2, fullname: 'Acme Corporation', email: 'contact@acme.co', phone: '+1 (555) 839-2001', address: '456 Corporate Blvd' }
          ]);

          const [appointments, setAppointments] = useState(readAppointmentRecords);

          const [documents, setDocuments] = useState(() => [
            { document_id: 1, case_title: 'Doe vs. Enterprise', document_name: 'Initial_Complaint_Draft.pdf', upload_date: '2026-03-14' },
            { document_id: 2, case_title: 'Acme Breach of Contract', document_name: 'Service_Agreement_v2.docx', upload_date: '2026-03-29' },
            ...readDocumentSubmissions()
          ]);

          const searchableRecords = [
            ...documentAccessRequests.map((request) => ({
              id: `access-request-${request.request_id}`,
              type: 'Access Request',
              title: request.document_name,
              details: `${request.client_name} ${request.client_email} ${request.status} ${request.requested_at}`,
              tab: 'access-requests'
            })),
            ...clients.map((client) => ({
              id: `client-${client.client_id}`,
              type: 'Client',
              title: client.fullname,
              details: `${client.client_id} ${client.email} ${client.phone} ${client.address} ${client.service_category} ${client.date_of_birth} ${client.case_brief}`,
              tab: 'clients'
            })),
            ...appointments.map((appointment) => ({
              id: `appointment-${appointment.appointment_id}`,
              type: 'Appointment',
              title: appointment.title,
              details: `${appointment.client} ${appointment.appointment_date} ${appointment.type} ${appointment.status}`,
              tab: 'appointments'
            })),
            ...documents.map((doc) => ({
              id: `document-${doc.document_id}`,
              type: 'Document',
              title: doc.document_name,
              details: `${doc.case_title} ${doc.upload_date} ${doc.document_id}`,
              tab: 'documents'
            }))
          ];
          const normalizeSearch = (value) => String(value).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          const searchTokens = normalizeSearch(searchQuery).split(/\s+/).filter(Boolean);
          const searchResults = searchTokens.length
            ? searchableRecords.filter((record) => {
                const searchableText = normalizeSearch(`${record.title} ${record.details} ${record.type}`);
                return searchTokens.every((token) => searchableText.includes(token));
              })
            : [];
          const matchesSearch = (record) => !searchTokens.length || searchTokens.every((token) => normalizeSearch(Object.values(record).join(' ')).includes(token));
          const matchesDocumentSearch = (doc) => matchesSearch({
            case_title: doc.case_title,
            document_name: doc.document_name,
            upload_date: doc.upload_date,
            review_status: doc.review_status,
            review_comment: doc.review_comment
          });

          useEffect(() => {
            if (window.lucide) {
              window.lucide.createIcons();
            }
          }, [authStatus, activeTab, menuOpen, intakeModalOpen, appointmentModalOpen, uploadModalOpen, documentAccessRequests, documents, appointments, notificationsOpen, notifications]);

          useEffect(() => {
            const syncDocumentRequests = (event) => {
              if (event.key !== ACCESS_REQUESTS_KEY) return;
              setDocumentAccessRequests(readDocumentAccessRequests());
            };
            window.addEventListener('storage', syncDocumentRequests);
            return () => window.removeEventListener('storage', syncDocumentRequests);
          }, []);

          useEffect(() => {
            const syncDocumentSubmissions = (event) => {
              if (event.key !== DOCUMENT_REVIEW_KEY) return;
              const submissions = readDocumentSubmissions();
              setDocuments((currentDocuments) => [
                ...currentDocuments.filter((doc) => !doc.review_status),
                ...submissions
              ]);
            };
            window.addEventListener('storage', syncDocumentSubmissions);
            return () => window.removeEventListener('storage', syncDocumentSubmissions);
          }, []);

          useEffect(() => {
            const syncAppointments = (event) => {
              if (event.key !== APPOINTMENTS_KEY) return;
              setAppointments(readAppointmentRecords());
            };
            window.addEventListener('storage', syncAppointments);
            return () => window.removeEventListener('storage', syncAppointments);
          }, []);

          useEffect(() => {
            const syncNotifications = (event) => {
              if (event.key !== NOTIFICATIONS_KEY) return;
              setNotifications(readNotifications());
            };
            window.addEventListener('storage', syncNotifications);
            return () => window.removeEventListener('storage', syncNotifications);
          }, []);

          useEffect(() => {
            if (!notificationsOpen) return undefined;
            const closeNotificationsOnEscape = (event) => {
              if (event.key === 'Escape') setNotificationsOpen(false);
            };
            window.addEventListener('keydown', closeNotificationsOnEscape);
            return () => window.removeEventListener('keydown', closeNotificationsOnEscape);
          }, [notificationsOpen]);

          useEffect(() => {
            const handleSearchShortcut = (event) => {
              if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                if (authStatus === 'dashboard') {
                  searchInputRef.current?.focus();
                }
              }
            };
            window.addEventListener('keydown', handleSearchShortcut);
            return () => window.removeEventListener('keydown', handleSearchShortcut);
          }, [authStatus]);

          useEffect(() => {
            if (!intakeModalOpen) return undefined;
            const handleModalKeyDown = (event) => {
              if (event.key === 'Escape') {
                setIntakeModalOpen(false);
              }
            };
            window.addEventListener('keydown', handleModalKeyDown);
            return () => window.removeEventListener('keydown', handleModalKeyDown);
          }, [intakeModalOpen]);

          const handleLoginSubmit = (e) => {
            e.preventDefault();
            // Basic authentication trigger for demonstration
            if (emailInput && passwordInput) {
              setAuthStatus('dashboard');
            }
          };

          const handleLogout = () => {
            setMenuOpen(false);
            setNotificationsOpen(false);
            setAuthStatus('login');
          };

          const addNotification = (notification) => {
            const currentNotifications = readNotifications();
            const updatedNotifications = [{
              notification_id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
              ...notification,
              created_at: new Date().toISOString(),
              read: false
            }, ...currentNotifications].slice(0, 100);
            try {
              window.localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(updatedNotifications));
              setNotifications(updatedNotifications);
            } catch (error) {
              console.error('Unable to save a portal notification.', error);
              window.alert('The form was saved, but its notification could not be saved. Check browser storage.');
            }
          };

          const updateNotifications = (update) => {
            const updatedNotifications = update(readNotifications());
            try {
              window.localStorage.setItem(NOTIFICATIONS_KEY, JSON.stringify(updatedNotifications));
              setNotifications(updatedNotifications);
            } catch (error) {
              console.error('Unable to update portal notifications.', error);
              window.alert('Unable to update notifications. Check browser storage and try again.');
            }
          };

          const markAllNotificationsRead = () => {
            updateNotifications((current) => current.map((notification) => (
              notification.audience === 'staff' ? { ...notification, read: true } : notification
            )));
          };

          const openNotification = (notification) => {
            if (!notification.read) {
              updateNotifications((current) => current.map((item) => (
                item.notification_id === notification.notification_id ? { ...item, read: true } : item
              )));
            }
            if (notification.tab) setActiveTab(notification.tab);
            setNotificationsOpen(false);
          };

          const saveAppointments = (updatedAppointments, errorMessage) => {
            try {
              window.localStorage.setItem(APPOINTMENTS_KEY, JSON.stringify(updatedAppointments));
              setAppointments(updatedAppointments);
              return true;
            } catch (error) {
              console.error(errorMessage, error);
              window.alert('Unable to save appointment changes in browser storage. Check available storage and try again.');
              return false;
            }
          };

          const handleAppointmentDraft = (event) => {
            event.preventDefault();
            const formData = new FormData(event.currentTarget);
            const             readText = (name) => String(formData.get(name) || '').trim();
            const title =     readText   ('appointment_title'    );
            const client =    readText   ('appointment_client'   );
            const date =      readText   ('appointment_date'     );
            const time =      readText   ('appointment_time'     );
            const type =      readText   ('appointment_type'     );
            const duration =  readText   ('appointment_duration' );
            const timeZone =  readText   ('appointment_timezone' );
            if (!title || !client || !date || !time || !type || !duration || !timeZone) {
              setAppointmentError('Complete all required appointment details before saving the draft.');
              return;
            }

            const currentAppointments = readAppointmentRecords();
            const now = new Date().toISOString();
            const draft = {
              appointment_id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
              title,
              client,
              case_title: readText('appointment_case'),
              appointment_date: `${date} ${time} (${timeZone})`,
              requested_date: date,
              requested_time: time,
              time_zone: timeZone,
              duration,
              type,
              location: readText('appointment_location'),
              attendees: readText('appointment_attendees'),
              notes: readText('appointment_notes'),
              status: 'Draft — Pending Attorney Review',
              created_by: staffProfile.fullname,
              created_at: now,
              updated_at: now
            };
            if (saveAppointments([...currentAppointments, draft], 'Unable to save the appointment draft.')) {
              setAppointmentError('');
              setAppointmentModalOpen(false);
            }
          };

          const submitAppointmentForReview = (appointmentId) => {
            const currentAppointments = readAppointmentRecords();
            const updatedAppointments = currentAppointments.map((appointment) => (
              appointment.appointment_id === appointmentId && appointment.status === 'Draft — Pending Attorney Review'
                ? {
                    ...appointment,
                    status: 'Attorney Review — Submitted',
                    submitted_at: new Date().toISOString(),
                    last_notified_at: new Date().toISOString(),
                    notification_channel: 'Internal appointment review queue',
                    updated_at: new Date().toISOString()
                  }
                : appointment
            ));
            const submittedAppointment = updatedAppointments.find((appointment) => appointment.appointment_id === appointmentId);
            if (saveAppointments(updatedAppointments, 'Unable to submit the appointment for attorney review.') && submittedAppointment?.status === 'Attorney Review — Submitted') {
              addNotification({
                audience: 'attorney',
                type: 'appointment-review',
                title: 'Appointment submitted for review',
                message: `${submittedAppointment.client}: ${submittedAppointment.title} — ${submittedAppointment.appointment_date}`,
                tab: 'schedule',
                role: 'lawyer'
              });
            }
          };

          const submitAlternativeForReview = (appointment) => {
            const selectedSlot = alternativeSelections[appointment.appointment_id] || {};
            if (!selectedSlot.date || !selectedSlot.time) {
              window.alert('Enter the date and time selected by the client before resubmitting.');
              return;
            }
            const selectedDateTime = `${selectedSlot.date} ${selectedSlot.time}${appointment.time_zone ? ` (${appointment.time_zone})` : ''}`;
            const currentAppointments = readAppointmentRecords();
            const updatedAppointments = currentAppointments.map((record) => (
              record.appointment_id === appointment.appointment_id
                ? {
                    ...record,
                    appointment_date: selectedDateTime,
                    requested_date: selectedSlot.date,
                    requested_time: selectedSlot.time,
                    client_selected_alternative: selectedDateTime,
                    attorney_alternatives: '',
                    status: 'Attorney Review — Submitted',
                    submitted_at: new Date().toISOString(),
                    last_notified_at: new Date().toISOString(),
                    notification_channel: 'Internal appointment review queue',
                    updated_at: new Date().toISOString()
                  }
                : record
            ));
            if (saveAppointments(updatedAppointments, 'Unable to resubmit the selected appointment time.')) {
              addNotification({
                audience: 'attorney',
                type: 'appointment-review',
                title: 'Alternative appointment submitted for review',
                message: `${appointment.client}: ${appointment.title} — ${selectedDateTime}`,
                tab: 'schedule',
                role: 'lawyer'
              });
              setAlternativeSelections((previous) => ({ ...previous, [appointment.appointment_id]: { date: '', time: '' } }));
            }
          };

          const confirmClientAppointment = (appointmentId) => {
            const currentAppointments = readAppointmentRecords();
            const updatedAppointments = currentAppointments.map((appointment) => (
              appointment.appointment_id === appointmentId && appointment.status === 'Approved — Client Confirmation Needed'
                ? {
                    ...appointment,
                    status: 'Confirmed — Master Calendar Updated',
                    client_confirmed_at: new Date().toISOString(),
                    master_calendar_updated_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                  }
                : appointment
            ));
            saveAppointments(updatedAppointments, 'Unable to update the confirmed appointment.');
          };

          const createDailySummaryText = () => {
            const actionable = appointments.filter((appointment) => [
              'Draft — Pending Attorney Review',
              'Attorney Review — Submitted',
              'Reschedule — Alternatives Needed'
            ].includes(appointment.status));
            const summaryDate = new Date().toLocaleDateString();
            const lines = [
              `Scheduling approvals needed — ${summaryDate}`,
              '',
              ...actionable.map((appointment, index) => [
                `${index + 1}. ${appointment.client}${appointment.case_title ? ` / ${appointment.case_title}` : ''}`,
                `   Proposed: ${appointment.appointment_date} | ${appointment.title} (${appointment.duration || 'duration not specified'})`,
                `   Status: ${appointment.status}`,
                `   Action: ${appointment.status === 'Reschedule — Alternatives Needed' ? 'Please provide/confirm workable alternative dates and times.' : 'Please approve or provide alternative dates and times.'}`
              ].join('\n'))
            ];
            if (!actionable.length) lines.push('No appointment requests are awaiting attorney action.');
            lines.push('', `Prepared by: ${staffProfile.fullname}`);
            return lines.join('\n');
          };

          const buildDailySummary = () => {
            setDailySummary(createDailySummaryText());
            setDailySummaryMessage('');
          };

          const copyDailySummary = async () => {
            const summary = createDailySummaryText();
            setDailySummary(summary);
            try {
              await navigator.clipboard.writeText(summary);
              setDailySummaryMessage('Summary copied. Send it through the firm-approved channel.');
            } catch (error) {
              console.error('Unable to copy the daily appointment summary.', error);
              setDailySummaryMessage('Copy is unavailable in this browser. Select and copy the summary text manually.');
            }
          };

          const handleAccessRequestDecision = (requestId, status) => {
            const latestRequests = readDocumentAccessRequests();
            const updatedRequests = latestRequests.map((request) => (
              request.request_id === requestId && request.status === 'Pending'
                ? { ...request, status, reviewed_at: new Date().toISOString(), reviewed_by: staffProfile.fullname }
                : request
            ));
            try {
              window.localStorage.setItem(ACCESS_REQUESTS_KEY, JSON.stringify(updatedRequests));
              setDocumentAccessRequests(updatedRequests);
            } catch (error) {
              console.error('Unable to save the document access decision.', error);
              window.alert('Unable to save the decision. Please check browser storage and try again.');
            }
          };

          const handleIntakeSubmit = (event) => {
            event.preventDefault();
            const formData = new FormData(event.currentTarget);
            const readText = (name) => String(formData.get(name) || '').trim();
            const firstName = readText('first_name');
            const lastName = readText('last_name');
            const addressParts = [
              readText('street_address'),
              readText('city'),
              readText('state_province')
            ].filter(Boolean);

            setClients((currentClients) => [
              ...currentClients,
              {
                client_id: Math.max(0, ...currentClients.map((client) => client.client_id)) + 1,
                fullname: `${firstName} ${lastName}`,
                email: readText('email'),
                phone: readText('phone'),
                address: addressParts.join(', ') || '—',
                service_category: readText('service_category'),
                date_of_birth: readText('date_of_birth'),
                case_brief: readText('case_brief'),
                worked_before: readText('worked_before')
              }
            ]);
            addNotification({
              audience: 'attorney',
              type: 'client-intake',
              title: 'New client intake submitted',
              message: `${firstName} ${lastName} — ${readText('service_category') || 'Service category not specified'}`,
              tab: 'users',
              role: 'admin'
            });
            setIntakeModalOpen(false);
          };

          const handleDocumentSelection = (event) => {
            const selectedFile = event.target.files && event.target.files[0];
            setSelectedUploadFile(selectedFile || null);
            if (selectedFile) setUploadDocumentTitle(selectedFile.name);
            setUploadError('');
          };

          const handleDocumentUpload = async (event) => {
            event.preventDefault();
            const formData = new FormData(event.currentTarget);
            const caseTitle = String(formData.get('case_title') || '').trim();
            const documentTitle = String(formData.get('document_title') || '').trim();
            const uploadDate = String(formData.get('upload_date') || '').trim();
            if (!selectedUploadFile) {
              setUploadError('Choose a file before uploading.');
              return;
            }
            if (!caseTitle || !documentTitle || !uploadDate) {
              setUploadError('Enter the case title, document title, and upload date.');
              return;
            }

            try {
              const fileData = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error || new Error('Unable to read the selected file.'));
                reader.readAsDataURL(selectedUploadFile);
              });
              const submissions = readDocumentSubmissions();
              const reviewDocument = {
                document_id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                case_title: caseTitle,
                document_name: documentTitle,
                upload_date: uploadDate,
                uploaded_by: staffProfile.fullname,
                file_name: selectedUploadFile.name,
                file_type: selectedUploadFile.type || 'application/octet-stream',
                file_data_url: fileData,
                review_status: 'Pending Review',
                review_comment: '',
                reviewed_by: '',
                reviewed_at: ''
              };
              const updatedSubmissions = [...submissions, reviewDocument];
              window.localStorage.setItem(DOCUMENT_REVIEW_KEY, JSON.stringify(updatedSubmissions));
              setDocuments((currentDocuments) => [...currentDocuments, reviewDocument]);
              addNotification({
                audience: 'attorney',
                type: 'document-submission',
                title: 'Document submitted for review',
                message: `${reviewDocument.document_name} — ${reviewDocument.case_title}`,
                tab: 'document-review',
                role: 'lawyer'
              });
              setSelectedUploadFile(null);
              setUploadDocumentTitle('');
              setUploadError('');
              setUploadModalOpen(false);
            } catch (error) {
              console.error('Unable to submit the document for attorney review.', error);
              setUploadError('Unable to save this document in browser storage. Try a smaller file or clear available storage.');
            }
          };

          const isDocumentDeclined = (doc) => ['declined', 'rejected'].includes(String(doc.review_status || '').toLowerCase());

          const handlePrintDocument = (doc) => {
            if (isDocumentDeclined(doc)) {
              window.alert('This document was declined by the attorney and cannot be printed.');
              return;
            }
            const fileUrl = doc.file_url || doc.file_data_url;
            if (!fileUrl) return;
            const printWindow = window.open(fileUrl, '_blank');
            if (!printWindow) {
              window.alert('Allow pop-ups for this site to print the document.');
              return;
            }
            printWindow.addEventListener('load', () => {
              printWindow.focus();
              printWindow.print();
            }, { once: true });
          };

          // --- LOGIN VIEW ---
          if (authStatus === 'login') {
            return (
              <div className="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950 via-[#030712] to-black flex items-center justify-center p-4">
                <div className="max-w-md w-full bg-slate-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-amber-500/20 p-8">
                  <div className="text-center mb-8">
                    <div className="inline-flex p-3 bg-amber-500/10 text-amber-400 rounded-full mb-3 border border-amber-500/30 gold-glow-sm">
                      <i data-lucide="users" className="w-8 h-8"></i>
                    </div>

                        </button>
                      </div>
                    </form>
                  </section>
                </div>
              )}

              {intakeModalOpen && (
                <div
                  className="fixed inset-0 z-[70] flex items-center justify-center overflow-y-auto bg-black/70 p-4 backdrop-blur-sm"
                  onMouseDown={(event) => {
                    if (event.target === event.currentTarget) setIntakeModalOpen(false);
                  }}
                >
                  <section
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="intake-modal-title"
                    className="my-auto w-full max-w-2xl overflow-hidden rounded-2xl border border-amber-500/30 bg-slate-900 shadow-2xl"
                  >
                    <div className="flex items-center justify-between border-b border-slate-800 px-6 py-4">
                      <h2 id="intake-modal-title" className="text-xl font-bold text-white">Client Intake Form</h2>
                      <button
                        type="button"
                        onClick={() => setIntakeModalOpen(false)}
                        aria-label="Close client intake form"
                        className="rounded-lg px-2 py-1 text-2xl leading-none text-slate-400 transition hover:bg-slate-800 hover:text-white"
                      >
                        &times;
                      </button>
                    </div>
                    <p className="px-6 pt-4 text-sm text-slate-400">Please fill in the required information.</p>

                    <form onSubmit={handleIntakeSubmit} className="max-h-[75vh] space-y-4 overflow-y-auto px-6 py-5">
                      <div>
                        <label htmlFor="intake-service-category" className="mb-1 block text-sm font-medium text-slate-200">Service Category / Practice Area <span className="text-amber-400">*</span></label>
                        <select id="intake-service-category" name="service_category" required defaultValue="" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-amber-500">
                          <option value="" disabled>Select the service needed...</option>
                          <option value="Litigation & Court Appearance">Litigation &amp; Court Appearance</option>
                          <option value="Contract Drafting & Legal Review">Contract Drafting &amp; Legal Review</option>
                          <option value="Real Estate & Property Transfer">Real Estate &amp; Property Transfer</option>
                          <option value="Corporate & Business Permitting">Corporate &amp; Business Permitting</option>
                          <option value="Estate Planning & Inheritance">Estate Planning &amp; Inheritance</option>
                          <option value="Notarial Services & Affidavits">Notarial Services &amp; Affidavits</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                          <label htmlFor="intake-first-name" className="mb-1 block text-sm font-medium text-slate-200">First Name <span className="text-amber-400">*</span></label>
                          <input id="intake-first-name" name="first_name" type="text" placeholder="First" required className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                        </div>
                        <div>
                          <label htmlFor="intake-last-name" className="mb-1 block text-sm font-medium text-slate-200">Last Name <span className="text-amber-400">*</span></label>
                          <input id="intake-last-name" name="last_name" type="text" placeholder="Last" required className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                        </div>
                        <div>
                          <label htmlFor="intake-date-of-birth" className="mb-1 block text-sm font-medium text-slate-200">Date of Birth</label>
                          <input id="intake-date-of-birth" name="date_of_birth" type="date" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-amber-500" />
                        </div>
                        <div>
                          <label htmlFor="intake-phone" className="mb-1 block text-sm font-medium text-slate-200">Phone Number <span className="text-amber-400">*</span></label>
                          <input id="intake-phone" name="phone" type="tel" placeholder="### ### ####" required className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                        </div>
                      </div>

                      <div>
                        <label htmlFor="intake-email" className="mb-1 block text-sm font-medium text-slate-200">Email Address <span className="text-amber-400">*</span></label>
                        <input id="intake-email" name="email" type="email" placeholder="example@email.com" required className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                      </div>

                      <div>
                        <label htmlFor="intake-street-address" className="mb-1 block text-sm font-medium text-slate-200">Street Address</label>
                        <input id="intake-street-address" name="street_address" type="text" placeholder="Street Address" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                      </div>

                      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                          <label htmlFor="intake-city" className="mb-1 block text-sm font-medium text-slate-200">City</label>
                          <input id="intake-city" name="city" type="text" placeholder="City" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                        </div>
                        <div>
                          <label htmlFor="intake-state-province" className="mb-1 block text-sm font-medium text-slate-200">State / Province</label>
                          <input id="intake-state-province" name="state_province" type="text" placeholder="State / Province" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500" />
                        </div>
                      </div>

                      <div>
                        <label htmlFor="intake-case-brief" className="mb-1 block text-sm font-medium text-slate-200">Briefly explain what you may need assistance with</label>
                        <textarea id="intake-case-brief" name="case_brief" rows="4" placeholder="Describe the legal issue or case details..." className="w-full resize-y rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none placeholder:text-slate-500 focus:border-amber-500"></textarea>
                      </div>

                      <fieldset>
                        <legend className="mb-2 text-sm font-medium text-slate-200">Have you worked with us before?</legend>
                        <div className="flex gap-5 text-sm text-slate-300">
                          <label className="flex items-center gap-2"><input type="radio" name="worked_before" value="yes" className="accent-amber-500" /> Yes</label>
                          <label className="flex items-center gap-2"><input type="radio" name="worked_before" value="no" defaultChecked className="accent-amber-500" /> No</label>
                        </div>
                      </fieldset>

                      <div className="flex justify-end gap-3 border-t border-slate-800 pt-4">
                        <button type="button" onClick={() => setIntakeModalOpen(false)} className="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800">Cancel</button>
                        <button type="submit" className="rounded-lg bg-gradient-to-r from-amber-600 to-amber-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:from-amber-500 hover:to-amber-400">Submit Intake Form</button>
                      </div>
                    </form>
                  </section>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<StaffPortalApp />);
    </script>
</body>
